<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salsas y Toppings — KAPÉ Lomitos Árabes</title>
  <meta name="description" content="Acompañá tu lomito árabe con nuestras salsas caseras y toppings en KAPÉ, Villa María, Córdoba. Pedí online." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0D0D0D" />
  <link rel="canonical" href="https://www.xn--kap-dma.com.ar/subP%C3%A1ginas/index.salsas.html" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Salsas y Toppings — KAPÉ Lomitos Árabes" />
  <meta property="og:description" content="Acompañá tu pedido con nuestras salsas caseras y los mejores toppings." />
  <meta property="og:url" content="https://www.xn--kap-dma.com.ar/subP%C3%A1ginas/index.salsas.html" />
  <meta property="og:site_name" content="KAPÉ Lomitos Árabes" />
  <meta property="og:locale" content="es_AR" />
  <link rel="stylesheet" href="salsas.css" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>

  <header class="header" role="banner">
    <a href="../index.html" class="back-btn" aria-label="Volver al inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Volver
    </a>
    <a href="../index.html" class="header__logo">
      <span class="logo-k" aria-hidden="true">K</span>
      <span class="logo-name">Kapé</span>
    </a>
    <button class="cart-btn" onclick="toggleDrawer()" aria-label="Abrir carrito de compras">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 01-8 0"/>
      </svg>
      <span class="cart-total" id="cartTotal">$0</span>
      <span class="cart-badge" id="cartBadge">0</span>
    </button>
  </header>

  <section class="hero">
    <div>
      <span class="hero__eyebrow">Nuestro menú</span>
      <h1 class="hero__title">Salsas</h1>
    </div>
  </section>

  <main class="menu">
    <p class="menu__desc">
      Acompañá tu pedido con nuestras salsas caseras y sumale un toque extra con los mejores toppings.
    </p>
    <div id="productosList"></div>
    <div id="loadingMsg" class="loading-msg">Cargando productos...</div>
  </main>

  <div class="overlay" id="overlay" onclick="toggleDrawer()"></div>

    <aside class="drawer" id="drawer" role="dialog" aria-label="Carrito de compras" aria-modal="true">
    <div class="drawer__header">
      <span class="drawer__title">Tu pedido</span>
      <button class="drawer__close" onclick="toggleDrawer()" aria-label="Cerrar carrito">✕</button>
    </div>
    <div class="drawer__items" id="drawerItems">
      <p class="drawer__empty">Tu carrito está vacío.</p>
    </div>
    <div class="drawer__footer">
      <div class="drawer__subtotal">
        <span class="drawer__subtotal-label">Total</span>
        <span class="drawer__subtotal-price" id="drawerTotal">$0</span>
      </div>
      <p class="upsell-msg" id="upsellSalsas" style="display:none"></p>
      <button class="checkout-btn" onclick="handleCheckout()" aria-label="Confirmar y enviar pedido">Confirmar pedido</button>
    </div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <footer class="footer" role="contentinfo">
    <span>© 2026 Kapé · Villa María</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseConfig.js"></script>
  <script src="../carrito/carrito.js"></script>
  <script src="salsas.js"></script>

</body>
</html>
