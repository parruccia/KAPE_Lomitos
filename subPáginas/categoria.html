<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Categoría — KAPÉ Lomitos Árabes</title>
  <meta name="description" id="pageDescription" content="Explorá el menú de KAPÉ Lomitos Árabes en Villa María, Córdoba. Pedí online con delivery o retiro en local." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0D0D0D" />
  <link rel="canonical" href="https://www.xn--kap-dma.com.ar/subP%C3%A1ginas/categoria.html" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Menú — KAPÉ Lomitos Árabes" />
  <meta property="og:description" content="Explorá el menú completo y pedí online con delivery o retiro en local." />
  <meta property="og:url" content="https://www.xn--kap-dma.com.ar/subP%C3%A1ginas/categoria.html" />
  <meta property="og:site_name" content="KAPÉ Lomitos Árabes" />
  <meta property="og:locale" content="es_AR" />
  <link rel="stylesheet" href="lomitos.css" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>

  <header class="header" role="banner">
    <a href="../index.html" class="back-btn" aria-label="Volver al inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Volver
    </a>
      <button class="cart-btn" onclick="toggleDrawer()" aria-label="Abrir carrito de compras">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 01-8 0"/>
      </svg>
      <span class="cart-total" id="cartTotal">$0</span>
      <span class="cart-badge" id="cartBadge">0</span>
    </button>
  </header>

  <section class="hero">
    <div>
      <span class="hero__eyebrow">Nuestro menú</span>
      <h1 class="hero__title" id="categoriaNombre">Cargando...</h1>
    </div>
  </section>

    <main class="menu" id="mainContent">
    <div id="productosList"></div>
    <div id="loadingMsg" class="loading-msg">Cargando productos...</div>
  </main>

  <div class="overlay" id="overlay" onclick="toggleDrawer()"></div>

    <aside class="drawer" id="drawer" role="dialog" aria-label="Carrito de compras" aria-modal="true">
    <div class="drawer__header">
      <span class="drawer__title">Tu pedido</span>
      <button class="drawer__close" onclick="toggleDrawer()" aria-label="Cerrar carrito">✕</button>
    </div>
    <div class="drawer__items" id="drawerItems">
      <p class="drawer__empty">Tu carrito está vacío.</p>
    </div>
    <div class="drawer__footer">
      <div class="drawer__subtotal">
        <span class="drawer__subtotal-label">Total</span>
        <span class="drawer__subtotal-price" id="drawerTotal">$0</span>
      </div>
      <button class="checkout-btn" onclick="handleCheckout()" aria-label="Confirmar y enviar pedido">Confirmar pedido</button>
    </div>
  </aside>

 <!-- ══ MODAL PERSONALIZAR (solo si la categoría lo permite) ══ -->
  <div class="overlay" id="overlayPersonalizar" onclick="cerrarPersonalizar()"></div>

  <div class="modal-personalizar" id="modalPersonalizar">
    <div class="modal-personalizar__header">
      <span class="modal-personalizar__title" id="personalizarNombre">Producto</span>
      <button class="drawer__close" onclick="cerrarPersonalizar()" aria-label="Cerrar personalización">✕</button>
    </div>
    <div class="modal-personalizar__body">
      <div class="modal-personalizar__grupo">
        <span class="modal-personalizar__label"><span id="labelSalsas">Salsas</span> <span id="contadorSalsas" class="modal-personalizar__contador"></span></span>
        <div id="personalizarSalsas" class="modal-personalizar__opciones"></div>
      </div>
      <div class="modal-personalizar__grupo">
        <span class="modal-personalizar__label"><span id="labelToppings">Toppings</span> <span id="contadorToppings" class="modal-personalizar__contador"></span></span>
        <div id="personalizarToppings" class="modal-personalizar__opciones"></div>
      </div>
    </div>
    <div class="modal-personalizar__footer">
      <span class="modal-personalizar__total" id="personalizarTotal">$0</span>
      <button class="checkout-btn" onclick="confirmarPersonalizar()" aria-label="Agregar producto personalizado al pedido">Agregar al pedido</button>
    </div>
  </div>


  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <footer class="footer" role="contentinfo">
    <span>Desarrollado por <a href="https://hornerosoftware.pages.dev/" rel="noopener">Hornero Software</a></span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseConfig.js"></script>
  <script src="../carrito/carrito.js"></script>
  <script src="categoria.js"></script>

</body>
</html>
